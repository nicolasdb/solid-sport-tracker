# Config interne du conteneur sportr-web. Ne fait que servir le build statique :
# TLS, redirection et en-têtes de sécurité sont gérés en amont par nginx-gateway.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log combined;

    # Pas de routeur côté client aujourd'hui, mais un rechargement sur une URL
    # inconnue doit rendre l'app plutôt qu'un 404 nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite émet des noms de fichiers hachés : leur contenu ne change jamais.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html, lui, doit rester non caché : c'est lui qui pointe vers les
    # noms hachés, et un cache dessus rendrait tout déploiement invisible.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
