# =============================================================================
# SERVICE: solid-sport-tracker
# DOMAIN: sportr.nicolasdb.eu
# PURPOSE: SPA statique de suivi sportif, lit/écrit sur pod.nicolasdb.eu
# SSL: Let's Encrypt, certificat DÉDIÉ sportr.nicolasdb.eu (pas le cert partagé)
# BACKEND: conteneur sportr-web (réseau gateway, port 80)
#
# À INSTALLER dans hetzner-gateway : copier ce fichier en
#   nginx/conf.d/14-sportr.conf
# puis y lancer `make vps-deploy`. Il vit ici pour rester versionné avec l'app
# qu'il expose ; hetzner-gateway reste la source de vérité du routage.
#
# Certificat dédié plutôt que l'habituel cert partagé nicolasdb.eu : au
# 2026-08-29 celui-ci ne peut plus être étendu, trois de ses domaines ne
# validant plus (n8n et pgadmin sont derrière un vhost .disabled, l'apex
# nicolasdb.eu pointe ailleurs que sur ce VPS). Étendre échouerait donc en
# bloc. Un cert isolé n'engage que ce service.
# =============================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  sportr.nicolasdb.eu;

    access_log  /var/log/nginx/sportr_http_access.log combined;
    error_log   /var/log/nginx/sportr_error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name  sportr.nicolasdb.eu;

    http2 on;

    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/sportr.nicolasdb.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportr.nicolasdb.eu/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log  /var/log/nginx/sportr_https_access.log combined;
    error_log   /var/log/nginx/sportr_error.log;

    location / {
        # Variable + resolver : nginx ne refuse pas de démarrer si le conteneur
        # est absent, contrairement à un nom résolu au chargement de la config.
        set $upstream http://sportr-web:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
